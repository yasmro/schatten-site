name: Deploy to GitHub Pages

# The site describes the npm release it depends on (`@yasmro/schatten` in
# package.json), never the library's develop branch — there is no workspace
# link to the source. A new library release reaches the site as a dependency
# bump PR (Dependabot), which runs CI; merging it to main deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same gates as CI — a deploy must not publish what a PR would have failed on.
      - run: pnpm check
      - run: pnpm check:links
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build site
        env:
          # e.g. /schatten-site/ — derived from the repository name by configure-pages.
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
