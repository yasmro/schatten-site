name: Deploy to GitHub Pages

# The site describes the npm release it depends on (`@yasmro/schatten` in
# package.json), never the library's develop branch — there is no workspace
# link to the source. A new library release reaches the site as a dependency
# bump PR (Dependabot), which runs CI; merging it to main deploys.
#
# Pages serves the gh-pages branch, shared with PR previews (preview.yml). The
# site owns the root; `pr-preview/` belongs to the previews and is left alone.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same gates as CI — a deploy must not publish what a PR would have failed on.
      - run: pnpm check
      - run: pnpm check:links
      - name: Build site
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm build
      # Without this, Pages runs Jekyll, which drops Astro's `_astro/` directory.
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
